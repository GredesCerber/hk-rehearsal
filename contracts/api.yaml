{
  "openapi": "3.1.0",
  "info": {
    "title": "Список покупок API",
    "version": "0.1.0",
    "description": "Список покупок одной семьи. Данные хранятся в памяти сервера, без регистрации."
  },
  "paths": {
    "/api/items": {
      "get": {
        "operationId": "listItems",
        "summary": "Получить все товары",
        "responses": {
          "200": {
            "description": "Список товаров",
            "content": {
              "application/json": {
                "schema": { "type": "array", "items": { "$ref": "#/components/schemas/Item" } }
              }
            }
          }
        }
      },
      "post": {
        "operationId": "createItem",
        "summary": "Добавить товар",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/NewItem" }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Товар создан",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/Item" }
              }
            }
          },
          "400": {
            "description": "Пустое название",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/Error" }
              }
            }
          }
        }
      }
    },
    "/api/items/{id}": {
      "parameters": [
        { "name": "id", "in": "path", "required": true, "schema": { "type": "string" } }
      ],
      "patch": {
        "operationId": "updateItem",
        "summary": "Отметить товар купленным или снять отметку",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/ItemUpdate" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Товар обновлён",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/Item" }
              }
            }
          },
          "404": {
            "description": "Товар не найден",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/Error" }
              }
            }
          }
        }
      },
      "delete": {
        "operationId": "deleteItem",
        "summary": "Удалить товар",
        "responses": {
          "204": { "description": "Товар удалён" },
          "404": {
            "description": "Товар не найден",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/Error" }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Item": {
        "type": "object",
        "required": ["id", "name", "bought"],
        "properties": {
          "id": { "type": "string" },
          "name": { "type": "string", "minLength": 1 },
          "bought": { "type": "boolean" }
        },
        "additionalProperties": false
      },
      "NewItem": {
        "type": "object",
        "required": ["name"],
        "properties": {
          "name": { "type": "string" }
        },
        "additionalProperties": false
      },
      "ItemUpdate": {
        "type": "object",
        "required": ["bought"],
        "properties": {
          "bought": { "type": "boolean" }
        },
        "additionalProperties": false
      },
      "Error": {
        "type": "object",
        "required": ["error", "code"],
        "properties": {
          "error": { "type": "string" },
          "code": { "type": "string", "enum": ["empty_name", "not_found"] }
        },
        "additionalProperties": false
      }
    }
  }
}
